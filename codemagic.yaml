
workflows:
  renda-facil:
    name: RendaFacil - iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: latest

    scripts:
      - name: Instalar XcodeGen
        script: |
          brew install xcodegen

      - name: Gerar projeto Xcode
        script: |
          xcodegen generate

      - name: Compilar para o simulador iOS
        script: |
          set -e

          xcodebuild \
            -project RendaFacil.xcodeproj \
            -scheme RendaFacil \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compactar aplicação
        script: |
          set -e

          APP_PATH="build/Build/Products/Debug-iphonesimulator/RendaFacil.app"

          test -d "$APP_PATH"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            build/RendaFacil-iOS-Simulator.zip

    artifacts:
      - build/RendaFacil-iOS-Simulator.zip
      - /tmp/xcodebuild_logs/*.log
