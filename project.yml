name: RendaFacil

options:
  bundleIdPrefix: mz.rendafacil
  deploymentTarget:
    iOS: "17.0"

targets:
  RendaFacil:
    type: application
    platform: iOS
    sources:
      - path: Views
      - path: Models
      - path: Services
      - path: RendaFacilApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mz.rendafacil.app
        PRODUCT_NAME: RendaFacil
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
